<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artha AI - Finance Chat Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Header -->
  <header>
    <h1> Artha AI</h1>
    <p id="modeStatus">General Mode Active</p>
  </header>

  <!-- Mode Selector -->
  <div class="mode-container">
    <label>Select Mode:</label>
    <select id="modeSelect">
      <option value="general">General Finance</option>
      <option value="investing">Investing</option>
      <option value="tax">Tax</option>
      <option value="startup">Startup</option>
    </select>
  </div>

  <!-- Chat Box -->
  <div id="chatBox" class="chat-box"></div>

  <!-- Input -->
  <form id="chat-form" class="input-area">
    <input type="text" id="input" placeholder="Ask about finance..." required>
    <button type="submit">Send</button>
  </form>

  <!-- Buttons -->
  <div class="actions">
    <button class="action-btn">Budget</button>
    <button class="action-btn">SIP</button>
    <button class="action-btn">Tax</button>
    <button class="new-chat-btn">New Chat</button>
  </div>

</div>

<script src="script.js"></script>
</body>

                        <div class="roi-value">+96%</div>
                    </div>

        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
